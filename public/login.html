<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMC Automation — Sign In</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    font:15px/1.5 system-ui,sans-serif; background:#f3f4f6; color:#111; }
  @media (prefers-color-scheme: dark){ body{ background:#0f1115; color:#e8e8e8; } }
  .card { width:340px; max-width:92vw; background:#fff; border:1px solid #e2e2e2;
    border-radius:12px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark){ .card{ background:#1a1d24; border-color:#2a2f3a; } }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:#6b7280; font-size:13px; }
  label { display:block; font-size:12px; font-weight:600; margin:14px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px 11px; border-radius:8px;
    border:1px solid #cbd5e1; background:#fff; color:inherit; font-size:14px; }
  @media (prefers-color-scheme: dark){ input{ background:#11141a; border-color:#374151; } }
  button { width:100%; margin-top:20px; padding:10px; border:0; border-radius:8px;
    background:#9d1a2d; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#86182a; }
  .err { color:#dc2626; font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>EMC Automation</h1>
    <p class="sub">Watchfire Ignite controller — restricted access.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    const r = await fetch('/api/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ email: email.value, password: password.value })
    });
    const j = await r.json();
    if (j.ok) location.href = '/';
    else err.textContent = j.reason || 'Sign in failed.';
  });
</script>
</body>
</html>
